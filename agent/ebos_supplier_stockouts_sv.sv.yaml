name: EBOS_SUPPLIER_STOCKOUTS_SV
description: "EBOS Healthcare essential medicine stock positions, purchase orders, suppliers, products and distribution centres."
tables:
  - name: PRODUCTS
    description: Product dimension.
    base_table:
      database: EBOS_DEV
      schema: EBOS_SUPPLIER_STOCKOUTS
      table: DIM_PRODUCT
    primary_key:
      columns:
        - PRODUCT_ID
    dimensions:
      - name: PRODUCT_CATEGORY
        description: Category
        expr: category
        data_type: VARCHAR(15)
        access_modifier: public_access
      - name: PRODUCT_IS_COLD_CHAIN
        description: Cold chain product
        expr: is_cold_chain
        data_type: BOOLEAN
        access_modifier: public_access
      - name: PRODUCT_NAME
        description: Product name
        expr: product_name
        data_type: VARCHAR(39)
        access_modifier: public_access
      - name: THERAPEUTIC_AREA
        description: Therapeutic area
        expr: therapeutic_area
        data_type: VARCHAR(18)
        access_modifier: public_access
  - name: PURCHASE_ORDERS
    description: "Purchase orders placed with suppliers, with promised and received dates."
    base_table:
      database: EBOS_DEV
      schema: EBOS_SUPPLIER_STOCKOUTS
      table: FACT_PURCHASE_ORDERS
    primary_key:
      columns:
        - PO_ID
    dimensions:
      - name: PO_ID
        description: Purchase order id
        expr: po_id
        data_type: VARCHAR(16777216)
        access_modifier: public_access
    facts:
      - name: DAYS_LATE
        description: Days received after promised date
        expr: days_late
        data_type: "NUMBER(38,0)"
        access_modifier: public_access
      - name: ORDERED_QTY
        description: Ordered quantity
        expr: ordered_qty
        data_type: "NUMBER(4,0)"
        access_modifier: public_access
      - name: RECEIVED_QTY
        description: Received quantity
        expr: received_qty
        data_type: "NUMBER(15,0)"
        access_modifier: public_access
    metrics:
      - name: AVG_DAYS_LATE
        description: Average days late
        expr: "ROUND(AVG(days_late), 1)"
        access_modifier: public_access
      - name: FILL_RATE_PCT
        description: Percent of ordered quantity received
        expr: "ROUND(SUM(received_qty) * 100.0 / SUM(ordered_qty), 1)"
        access_modifier: public_access
      - name: PO_COUNT
        description: Number of purchase orders
        expr: COUNT(*)
        access_modifier: public_access
    time_dimensions:
      - name: ORDER_DATE
        description: Order date
        expr: order_date
        data_type: DATE
        access_modifier: public_access
  - name: STOCK_POSITIONS
    description: "Weekly stock position per product, supplier and distribution centre. stockout_flag Y means the product was out of stock."
    base_table:
      database: EBOS_DEV
      schema: EBOS_SUPPLIER_STOCKOUTS
      table: FACT_STOCK_POSITIONS
    primary_key:
      columns:
        - POSITION_ID
    dimensions:
      - name: CATEGORY
        description: Product category
        expr: category
        data_type: VARCHAR(15)
        access_modifier: public_access
      - name: IS_COLD_CHAIN
        description: True if the product needs cold chain
        expr: is_cold_chain
        data_type: BOOLEAN
        access_modifier: public_access
      - name: LEAD_TIME_BAND
        description: "Supplier lead time band: Long (>45 days), Medium (15-45 days), Short (<15 days)"
        expr: lead_time_band
        data_type: VARCHAR(16777216)
        access_modifier: public_access
      - name: MONTH
        description: Month as YYYY-MM
        expr: month
        data_type: VARCHAR(16777216)
        access_modifier: public_access
      - name: STOCKOUT_FLAG
        description: "Y if out of stock that week, N otherwise"
        expr: stockout_flag
        data_type: VARCHAR(1)
        access_modifier: public_access
    facts:
      - name: DAYS_OF_COVER
        description: Days of stock cover
        expr: days_of_cover
        data_type: "NUMBER(13,1)"
        access_modifier: public_access
      - name: DEMAND_UNITS
        description: Weekly demand in units
        expr: demand_units
        data_type: "NUMBER(4,0)"
        access_modifier: public_access
      - name: LOST_SALES_NZD
        description: Estimated lost sales in NZD
        expr: lost_sales_nzd
        data_type: "NUMBER(38,2)"
        access_modifier: public_access
    metrics:
      - name: POSITION_COUNT
        description: Number of stock positions
        expr: COUNT(*)
        access_modifier: public_access
      - name: STOCKOUT_COUNT
        description: Number of stock-out weeks
        expr: COUNT_IF(stockout_flag = 'Y')
        access_modifier: public_access
      - name: STOCKOUT_RATE_PCT
        description: Percent of stock positions that were stock-outs
        expr: "ROUND(COUNT_IF(stockout_flag = 'Y') * 100.0 / COUNT(*), 1)"
        access_modifier: public_access
      - name: TOTAL_LOST_SALES_NZD
        description: Total estimated lost sales in NZD
        expr: SUM(lost_sales_nzd)
        access_modifier: public_access
    time_dimensions:
      - name: WEEK_START
        description: Week start date
        expr: week_start
        data_type: DATE
        access_modifier: public_access
  - name: SUPPLIERS
    description: Supplier dimension.
    base_table:
      database: EBOS_DEV
      schema: EBOS_SUPPLIER_STOCKOUTS
      table: DIM_SUPPLIER
    primary_key:
      columns:
        - SUPPLIER_ID
    dimensions:
      - name: COUNTRY
        description: Supplier country
        expr: country
        data_type: VARCHAR(11)
        access_modifier: public_access
      - name: RELIABILITY_TIER
        description: Reliability tier
        expr: reliability_tier
        data_type: VARCHAR(16777216)
        access_modifier: public_access
      - name: SUPPLIER_LEAD_TIME_BAND
        description: Lead time band
        expr: lead_time_band
        data_type: VARCHAR(16777216)
        access_modifier: public_access
      - name: SUPPLIER_NAME
        description: Supplier name
        expr: supplier_name
        data_type: VARCHAR(16777216)
        access_modifier: public_access
    facts:
      - name: LEAD_TIME_DAYS
        description: Typical lead time in days
        expr: lead_time_days
        data_type: "NUMBER(20,0)"
        access_modifier: public_access
  - name: WAREHOUSES
    description: Distribution centres across Australia and New Zealand.
    base_table:
      database: EBOS_DEV
      schema: EBOS_SUPPLIER_STOCKOUTS
      table: DIM_WAREHOUSE
    primary_key:
      columns:
        - WAREHOUSE_ID
    dimensions:
      - name: CITY
        description: City
        expr: city
        data_type: VARCHAR(12)
        access_modifier: public_access
      - name: DC_COUNTRY
        description: Country
        expr: country
        data_type: VARCHAR(11)
        access_modifier: public_access
      - name: WAREHOUSE_NAME
        description: Distribution centre name
        expr: warehouse_name
        data_type: VARCHAR(15)
        access_modifier: public_access
relationships:
  - name: PO_PRODUCT
    left_table: PURCHASE_ORDERS
    right_table: PRODUCTS
    relationship_columns:
      - left_column: PRODUCT_ID
        right_column: PRODUCT_ID
  - name: PO_SUPPLIER
    left_table: PURCHASE_ORDERS
    right_table: SUPPLIERS
    relationship_columns:
      - left_column: SUPPLIER_ID
        right_column: SUPPLIER_ID
  - name: PO_WAREHOUSE
    left_table: PURCHASE_ORDERS
    right_table: WAREHOUSES
    relationship_columns:
      - left_column: WAREHOUSE_ID
        right_column: WAREHOUSE_ID
  - name: SP_PRODUCT
    left_table: STOCK_POSITIONS
    right_table: PRODUCTS
    relationship_columns:
      - left_column: PRODUCT_ID
        right_column: PRODUCT_ID
  - name: SP_SUPPLIER
    left_table: STOCK_POSITIONS
    right_table: SUPPLIERS
    relationship_columns:
      - left_column: SUPPLIER_ID
        right_column: SUPPLIER_ID
  - name: SP_WAREHOUSE
    left_table: STOCK_POSITIONS
    right_table: WAREHOUSES
    relationship_columns:
      - left_column: WAREHOUSE_ID
        right_column: WAREHOUSE_ID
